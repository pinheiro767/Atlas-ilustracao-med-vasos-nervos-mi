<header class="hero">
  <div class="heroText">
    <p class="eyebrow">UEM • Anatomia Topográfica • Roteiro prático</p>
    <h1>Atlas Imersivo por Sistemas</h1>
    <p>Abas separadas conforme o roteiro: regiões, artérias, veias, nervos e linfonodos. Cada estrutura possui card próprio para fotos, anexos, observações, zoom e PDF.</p>
  </div>
  <div class="heroButtons">
    <button id="installBtn" hidden>📲 Instalar</button>
    <button id="pdfBtn">📄 Gerar PDF</button>
  </div>
</header>

<nav id="mainTabs" class="mainTabs"></nav>

<section class="toolbar">
  <input id="search" placeholder="🔎 Buscar no tópico atual...">
  <select id="groupFilter"></select>
</section>

<section id="cards" class="cards"></section>

<template id="cardTemplate">
  <article class="card">
    <div class="cardHeader">
      <span class="group"></span>
      <span class="counter"></span>
    </div>
    <h2></h2>
    <div class="info">
      <p><b>📍 Identificação:</b> localizar e representar no esqueleto, moldura, peça ou modelo conforme o roteiro.</p>
      <p><b>🧠 Foco da apresentação:</b> nome correto, posição topográfica, relação com estruturas vizinhas e função anatômica/clínica.</p>
    </div>
    <textarea placeholder="Anotações do grupo, correlação clínica, descrição da foto ou observação da peça..."></textarea>
    <div class="actions">
      <label>📷 Tirar fotos<input class="photoInput" type="file" accept="image/*" capture="environment" multiple></label>
      <label>📎 Anexar arquivos<input class="fileInput" type="file" multiple></label>
    </div>
    <div class="preview"></div>
  </article>
</template>
