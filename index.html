<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Topográfica de MMII — Aula 1</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><h1>Topográfica de MMII</h1><p>Roteiro prático interativo • Aula 1</p></div>
  <button id="themeBtn">🌙</button>
</header>
<main>
<section class="hero"><h2>Roteiro com informações ocultas</h2><p>Clique nos cards para revelar. Tire fotos, anexe arquivos e salve anotações por estrutura.</p></section>
<nav class="tabs">
<button class="tab active" data-tab="regioes">Regiões</button>
<button class="tab" data-tab="fascias">Fáscias/compartimentos</button>
<button class="tab" data-tab="arterias">Artérias</button>
<button class="tab" data-tab="veias">Veias</button>
<button class="tab" data-tab="linfonodos">Linfonodos</button>
</nav>
<section class="tools">
<input id="search" placeholder="Pesquisar estrutura...">
<button id="openAll">Mostrar tudo</button><button id="closeAll">Ocultar tudo</button><button id="export">Exportar dados</button>
</section>
<section id="cards" class="grid"></section>
</main>
<button id="aiFab">🤖</button>
<aside id="aiPanel">
<div class="aiTop"><b>IA de dúvidas rápidas</b><button id="xAi">×</button></div>
<div id="chat"><div class="bot">Pergunte algo curto: “onde passa a femoral profunda?”, “safena magna”, “dorsal do pé”.</div></div>
<div class="aiInput"><input id="qAi" placeholder="Digite sua dúvida..."><button id="sendAi">Enviar</button></div>
</aside>
<script src="app.js"></script>
</body></html>
